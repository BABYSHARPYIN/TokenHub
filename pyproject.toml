[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pool"
version = "0.1.0"
description = "共享分层推理计算池 — cleartext layered inference pool (v1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
metal = ["vllm", "mlx", "mlx-lm", "transformers"]
cuda = ["vllm", "torch", "transformers"]

[project.scripts]
pool = "pool.cli:main"

[tool.setuptools.packages.find]
include = ["pool*"]

[tool.setuptools.package-data]
pool = ["agent/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
